{% extends "core/base.html" %}
{% block title %}Попытка: {{ attempt.attempt_time }}{% endblock %}

{% block content %}
<h5><strong>Время попытки:</strong></h5>
<p> {{ attempt.attempt_time }} </p>

<h5><strong>Тема:</strong></h5>
<p>{{ attempt.newsletter.message.subject }}</p>

<h5><strong>Ответ сервера:</strong></h5>
<p>{{ attempt.smtp_answer }}</p>

<hr>

<a href="{% url 'core:attempt_list' %}" class="btn btn-secondary">
    Назад к списку
</a>
{% endblock %}
