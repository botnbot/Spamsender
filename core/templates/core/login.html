{% extends "core/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">Вход</div>
            <div class="card-body">

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
