{% extends "core/base.html" %}

{% block title %}Список попыток{% endblock %}

{% block content %}
<h1>Список попыток</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Дата</th>
            <th>статус</th>
        </tr>
    </thead>
    <tbody>
        {% for attempt in attempts %}
        <tr>
            <!-- Ссылка на детальный просмотр -->
            <td>
                <a href="{% url 'core:attempt_detail' attempt.pk %}">
                    {{ attempt.attempt_time }}
                </a>
            </td>
            <td>{{ attempt.status }}</td>
            <td>
                <a href="{% url 'core:attempt_update' attempt.pk %}" class="btn btn-sm btn-primary">Редактировать</a>
                <a href="{% url 'core:attempt_confirm_delete' attempt.pk %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Нет попыток</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'core:attempt_create' %}" class="btn btn-success mt-3">Сделать новую попытку</a>
{% endblock %}
