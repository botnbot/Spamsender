{% extends "core/base.html" %}

{% block title %}Удаление попытки{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-danger text-white">Подтверждение удаления</div>
    <div class="card-body">
        <p>Вы уверены, что хотите удалить попытку от {{ attempt.attempt_time }}?</p>
        <p>Статус: {{ attempt.status }}</p>

        <form method="post">
            {% csrf_token %}
            <a href="{% url 'core:attempt_list' %}" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-danger">Удалить</button>
        </form>
    </div>
</div>
{% endblock %}
