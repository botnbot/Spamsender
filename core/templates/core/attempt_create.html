{% extends "core/base.html" %}

{% block title %}Создать попытку{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header">Создать попытку отправки</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Создать</button>
            <a href="{% url 'core:attempt_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
